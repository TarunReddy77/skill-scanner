[project]
name = "skill-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langfuse>=4.16.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "strands-agents[otel]>=1.57.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
skill-scanner = "skill_scanner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
